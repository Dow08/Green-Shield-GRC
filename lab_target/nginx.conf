# ------------------------------------------------------------------
# nginx.conf — CIBLE D'AUDIT (fichier volontairement vulnérable)
# Ne PAS déployer en production. Sert de cible au lab AuditCraft GRC.
# ------------------------------------------------------------------

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    # [FAILLE] Divulgation de la version du serveur dans les en-têtes/erreurs.
    server_tokens on;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # [FAILLE] Protocoles TLS obsolètes (TLSv1 / TLSv1.1) : déchiffrables (POODLE/BEAST).
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # [FAILLE] Suite de chiffrement faible autorisée (RC4/MD5).
    ssl_ciphers HIGH:!aNULL:!MD5:RC4;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 443 ssl;
        server_name _;
        root /var/www/html;

        location / {
            index index.html;
        }
    }
}
