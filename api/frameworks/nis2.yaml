id: 'nis2'
name: 'Directive NIS 2'
description: 'Reglementation europeenne visant a elever le niveau de cybersecurite des entites essentielles et importantes.'
requirements:
  - id: 'NIS2-POL'
    title: 'Politique de securite des SI'
    description: 'Etablissement de politiques d''analyse des risques et de securite des systemes d''information.'
  - id: 'NIS2-INC'
    title: 'Gestion des incidents'
    description: 'Procedures de prevention, detection et notification des incidents de securite aux autorites.'
  - id: 'NIS2-BCP'
    title: 'Continuite d''activite'
    description: 'Mesures assurant la continuite des operations, y compris la gestion des sauvegardes et la reprise d''activite.'
  - id: 'NIS2-SUP'
    title: 'Securite de la chaine d''approvisionnement'
    description: 'Evaluation des risques lies aux relations avec les fournisseurs et prestataires de services tiers.'
