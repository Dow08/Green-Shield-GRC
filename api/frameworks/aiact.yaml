id: 'aiact'
name: 'EU AI Act'
description: 'Premier cadre reglementaire complet pour l''intelligence artificielle en Europe.'
requirements:
  - id: 'AIA-RISK'
    title: 'Systeme de gestion des risques'
    description: 'Evaluation continue des risques pour les systemes d''IA classes a ''haut risque''.'
  - id: 'AIA-DATA'
    title: 'Gouvernance des donnees'
    description: 'Garantir que les ensembles de donnees d''entrainement et de validation sont exempts de biais et securises.'
  - id: 'AIA-DOC'
    title: 'Documentation technique'
    description: 'Tenue d''une documentation detaillee attestant de la conformite du modele avant sa mise sur le marche.'
  - id: 'AIA-LOG'
    title: 'Enregistrement automatique (Logging)'
    description: 'Tracabilite des operations du modele d''IA pour detecter tout derapage ou anomalie en temps reel.'
