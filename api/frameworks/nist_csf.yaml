id: 'nist_csf'
name: 'NIST CSF 2.0'
description: 'Cadre americain agnostique de maturite cybersecurite (6 fonctions : Govern, Identify, Protect, Detect, Respond, Recover) — pilotage et communication CODIR, pas une certification.'
requirements:
  - id: 'GV.RM-01'
    title: 'Strategie de gestion des risques cyber etablie'
    description: 'Objectifs de gestion des risques et tolerance au risque convenus et communiques par la Direction (fonction Govern, nouvelle en CSF 2.0).'
  - id: 'ID.AM-01'
    title: 'Inventaire des actifs maintenu'
    description: 'Inventaire materiel et logiciel a jour, socle sans lequel 80% des projets de maturite echouent.'
  - id: 'PR.AA-03'
    title: 'Authentification forte deployee'
    description: 'MFA applique sur les acces a privileges et les systemes critiques.'
  - id: 'DE.CM-01'
    title: 'Surveillance continue des reseaux'
    description: 'Monitoring en place pour detecter les evenements et anomalies sur le perimetre reseau.'
  - id: 'RC.RP-03'
    title: 'Integrite des sauvegardes verifiee'
    description: 'Les sauvegardes sont testees et leur integrite verifiee avant toute restauration en conditions reelles.'
