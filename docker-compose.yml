# ==================================================================
# GREEN SHIELD — plateforme (3 services)
#   target_lab : la cible (configs vulnérables)
#   api        : FastAPI, moteurs des modules, lit la cible en READ-ONLY
#   web        : frontend React (nginx) → proxifie /api vers api:8000
# ==================================================================

services:
  target_lab:
    build: ./target_lab
    container_name: greenshield_target
    volumes:
      - ./lab_target/sshd_config:/etc/ssh/sshd_config:ro
      - ./lab_target/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: "no"

  api:
    build: ./api
    container_name: greenshield_api
    depends_on:
      - target_lab
    volumes:
      - ./lab_target:/audit/target:ro   # STRICT read-only
    environment:
      AUDIT_TARGET_DIR: /audit/target
    restart: unless-stopped

  web:
    build: ./web
    container_name: greenshield_web
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped
