# ==================================================================
# AuditCraft GRC — orchestration
#   target_lab   : la cible (possède les configs vulnérables)
#   auditor_app  : l'outil GRC (Streamlit), lit la cible en READ-ONLY
# Frontière de sécurité : aucun réseau entre les deux, lecture seule.
# ==================================================================

services:
  target_lab:
    build: ./target_lab
    container_name: auditcraft_target
    # La cible "possède" les fichiers vulnérables, à leurs emplacements standards.
    volumes:
      - ./lab_target/sshd_config:/etc/ssh/sshd_config:ro
      - ./lab_target/nginx.conf:/etc/nginx/nginx.conf:ro
    # Pas de ports exposés : la cible ne sert aucun réseau (audit hors-ligne).
    restart: "no"

  auditor_app:
    build: ./auditor
    container_name: auditcraft_auditor
    depends_on:
      - target_lab
    ports:
      - "8501:8501"
    # Accès aux configurations de la cible en STRICT READ-ONLY (:ro).
    volumes:
      - ./lab_target:/audit/target:ro
    environment:
      AUDIT_TARGET_DIR: /audit/target
    restart: unless-stopped
