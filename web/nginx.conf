server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://img.shields.io;" always;

    # API : proxifiÃ©e vers le service FastAPI du compose.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA : toutes les routes retombent sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

