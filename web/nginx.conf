server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-têtes de sécurité
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # CSP durcie (audit du 29/07/2026) :
    #   script-src : 'unsafe-inline' RETIRÉ — le build Vite de production n'émet
    #     aucun script inline (vérifié sur dist/index.html + navigateur réel,
    #     zéro violation console). C'est la protection XSS qui compte vraiment.
    #   style-src  : 'unsafe-inline' CONSERVÉ — framer-motion écrit des attributs
    #     style="opacity: …; transform: …" au runtime sur chaque élément animé.
    #     Le retirer casse toutes les animations de l'interface.
    #   img-src    : https://img.shields.io retiré — les badges ne vivent que
    #     dans le README (rendu par GitHub), jamais dans l'application.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

    # API : proxifiÃ©e vers le service FastAPI du compose.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA : toutes les routes retombent sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

