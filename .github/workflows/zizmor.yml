name: GitHub Actions Security Linter (Zizmor)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions: {}

jobs:
  zizmor:
    name: Run Zizmor Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Requis pour pousser les résultats dans l'onglet Security de GitHub
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Zizmor
        # Le projet a déménagé de woodruffw/zizmor-action (dépôt introuvable
        # depuis, vraisemblablement un transfert d'organisation) vers
        # zizmorcore/zizmor-action. La nouvelle action gère elle-même l'upload
        # SARIF vers l'onglet Security (advanced-security: true par défaut) :
        # plus besoin de l'étape d'upload séparée.
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1