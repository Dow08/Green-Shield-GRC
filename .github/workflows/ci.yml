name: CI

# Empêche qu'une régression atteigne `main` sans que la suite complète ait
# tourné : jusqu'ici les tests ne s'exécutaient qu'en local, à la discrétion de
# l'opérateur — et uniquement sous Windows/Python 3.14, jamais sous la
# combinaison Linux/Python 3.12 des dépendances épinglées.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@0b93645e5fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Installer les dépendances
        run: pip install -r api/requirements.txt

      - name: Environnement
        # Reporté dans le résumé de job : les logs bruts d'Actions exigent des
        # droits admin sur le dépôt, alors que le résumé est consultable
        # publiquement. Sans ça, un échec de CI n'est pas diagnosticable.
        run: |
          {
            echo '## Environnement backend'
            echo '```'
            python --version
            pip list
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tests
        id: tests
        # GREENSHIELD_DATA_DIR pointe vers un répertoire jetable du runner :
        # aucun test ne doit écrire dans l'emplacement de données par défaut.
        env:
          GREENSHIELD_DATA_DIR: ${{ runner.temp }}/greenshield/projects
        # L'échec est réémis à l'étape suivante, après publication du diagnostic.
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest api/tests -q --tb=short 2>&1 | tee pytest-output.txt

      - name: Rapport de tests
        if: always()
        run: |
          {
            echo '## Résultat pytest'
            echo '```'
            cat pytest-output.txt 2>/dev/null || echo 'aucune sortie capturée'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Échec des tests
        if: steps.tests.outcome == 'failure'
        run: |
          # Le résumé de job et les logs bruts exigent une session authentifiée,
          # même sur un dépôt public. Les *annotations*, elles, sont exposées par
          # l'API publique : on y republie la sortie pytest pour qu'un échec soit
          # diagnosticable sans droits sur le dépôt.
          MSG=$(python -c "print(open('pytest-output.txt', encoding='utf-8').read().replace(chr(13), '').replace(chr(10), '%0A'))")
          echo "::error title=pytest::${MSG}"
          exit 1

  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
