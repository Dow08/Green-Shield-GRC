name: CI

# Empêche qu'une régression atteigne `main` sans que les 172 tests aient tourné :
# jusqu'ici ils ne s'exécutaient qu'en local, à la discrétion de l'opérateur.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Installer les dépendances
        run: pip install -r api/requirements.txt

      - name: Tests
        # GREENSHIELD_DATA_DIR pointe vers un répertoire jetable du runner :
        # aucun test ne doit écrire dans l'emplacement de données par défaut.
        env:
          GREENSHIELD_DATA_DIR: ${{ runner.temp }}/greenshield/projects
        run: python -m pytest api/tests -q

  frontend:
    name: Frontend (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
